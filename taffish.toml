[package]
name = "oxdna"
kind = "tool"
version = "3.7.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/oxdna"

[command]
name = "taf-oxdna"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/oxdna:3.7.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["molecular-dynamics", "nucleic-acids", "structural-biology", "simulation", "trajectory-analysis"]
keywords = ["oxDNA", "oxRNA", "coarse-grained simulation", "molecular dynamics", "Monte Carlo", "oxpy", "OAT", "DNA nanotechnology", "RNA nanotechnology", "MPI"]
description = "oxDNA 3.7.0 CPU and MPI simulation runtime with oxpy bindings and the OAT 2.5.0 trajectory-analysis and structure-conversion suite."

[upstream]
name = "oxDNA"
type = "github"
repo = "lorenzo-rovigatti/oxDNA"
homepage = "https://lorenzo-rovigatti.github.io/oxDNA/"
manual = "https://lorenzo-rovigatti.github.io/oxDNA/"
release_url = "https://github.com/lorenzo-rovigatti/oxDNA/releases/tag/v3.7.0"
downloads = "https://github.com/lorenzo-rovigatti/oxDNA/archive/refs/tags/v3.7.0.tar.gz"
version = "3.7.0"
commit = "b78d23c73c26571eb36def3a2f59f586585461ae"
license = "GPL-3.0-only"
description = "Coarse-grained DNA and RNA simulation framework with standalone executables, Python bindings, and oxDNA Analysis Tools."
citation = "Poppleton E, Matthies M, Mandal D, Romano F, Sulc P, Rovigatti L. oxDNA: coarse-grained simulations of nucleic acids made simple. Journal of Open Source Software. 2023;8(81):4693."
doi = "10.21105/joss.04693"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 300
exist = ["oxDNA", "DNAnalysis", "confGenerator", "oxDNA_mpi", "oxdna-python", "oat", "oxdna-generate-sa", "oxdna-convert-topology", "mpirun"]
test = ["/opt/oxdna/share/testdata/oxdna-smoke.sh identity", "/opt/oxdna/share/testdata/oxdna-smoke.sh simulation", "/opt/oxdna/share/testdata/oxdna-smoke.sh mpi", "/opt/oxdna/share/testdata/oxdna-smoke.sh oxpy", "/opt/oxdna/share/testdata/oxdna-smoke.sh oat", "/opt/oxdna/share/testdata/oxdna-smoke.sh structure"]
